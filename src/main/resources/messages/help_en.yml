# Translation config for the AuthMe help, e.g. when /authme help or /authme help register is called

# -------------------------------------------------------
# List of texts used in the help section
common:
    header: '==========[ AuthMeReloaded HELP ]=========='
    optional: 'Optional'
    hasPermission: 'You have permission'
    noPermission: 'No permission'
    default: 'Default'
    result: 'Result'
    defaultPermissions:
        notAllowed: 'No permission'
        opOnly: 'OP''s only'
        allowed: 'Everyone allowed'

# -------------------------------------------------------
# Titles of the individual help sections
# Set the translation text to empty text to disable the section, e.g. to hide alternatives:
#   alternatives: ''
section:
    command: 'Command'
    description: 'Short description'
    detailedDescription: 'Detailed description'
    arguments: 'Arguments'
    permissions: 'Permissions'
    alternatives: 'Alternatives'
    children: 'Commands'

# -------------------------------------------------------
# You can translate the data for all commands using the below pattern.
# For example to translate /authme reload, create a section "authme.reload", or "login" for /login
# If the command has arguments, you can use arg1 as below to translate the first argument, and so forth
# Translations don't need to be complete; any missing section will be taken from the default silently
# Important: Put main commands like "authme" before their children (e.g. "authme.reload")
commands:
    lg:
        description: 'Personal login information menu'
        detailedDescription: 'View the account you are logged in with, its bound email address and all accounts under that email. Select an account to switch identity: you will be disconnected and, by rejoining within three minutes, you will enter the server as the selected account. Use /lg sync to manually record the UUID you are currently connected with into your account.'
    authme.register:
        description: 'Register a player'
        detailedDescription: 'Register the specified player with the specified password.'
        arg1:
            label: 'player'
            description: 'Player name'
        arg2:
            label: 'password'
            description: 'Password'
    authme.emailchange:
        description: 'Manage players'' bound emails'
        detailedDescription: 'Manage the email address bound to a player''s account, or the accounts bound to an email address. Subcommands: view <player> to view the bound email; set <player> <email> to change it; delete <player> to remove it; accounts <email> to list all accounts bound to an email; deleteaccount <player> to unregister an account (e.g. one found via accounts).'
        arg1:
            label: 'subcommand'
            description: 'view / set / delete / accounts / deleteaccount'
        arg2:
            label: 'player'
            description: 'Player name (view/set/delete/deleteaccount) or email address (accounts)'
        arg3:
            label: 'email'
            description: 'New email address (set only)'
